services:
  # 1. The FastAPI Gateway
  gateway:
    build: .
    container_name: llm-gateway-app
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - REDIS_HOST=redis
    depends_on:
      - redis

  # 2. The Redis Cache
  redis:
    image: redis:latest
    container_name: llm-gateway-redis
    ports:
      - "6379:6379"

  # 3. Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: llm-gateway-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway


 # 4. Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: llm-gateway-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=6767
    depends_on:
      - prometheus
